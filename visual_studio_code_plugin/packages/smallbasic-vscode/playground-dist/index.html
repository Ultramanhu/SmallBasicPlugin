<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Small Basic</title>
    <link rel="icon" href="data:," />
</head>
<body>
    <noscript>
        <p>JavaScript 已禁用 / JavaScript is disabled. 请直接打开 / Please open <a href="playground.html">playground.html</a> 或 / or <a href="runhost.html">runhost.html</a>。</p>
    </noscript>
    <script>
        (function () {
            var current = new URL(window.location.href);
            var target = new URL("playground.html", current);
            if (current.searchParams.has("session") || current.searchParams.get("view") === "runhost") {
                target = new URL("runhost.html", current);
            }
            target.search = current.search;
            target.hash = current.hash;
            window.location.replace(target.toString());
        })();
    </script>
</body>
</html>
